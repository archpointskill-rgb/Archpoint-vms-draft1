<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArchPoint Visitors</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: left navigation rail and a main work area; the rail becomes a scrolling bar on phones.
   Palette comes from the ArchPoint logo: deep blue primary, yellow and orange as small accents. */
:root{
 --bg:#f4f6f9;--surface:#ffffff;--surface2:#eef2f7;--fg:#16202e;--muted:#5a6678;--line:#d8dfe9;
 --blue:#004c99;--blue-fg:#ffffff;--blue-soft:#e3edf9;--yellow:#ffc700;--yellow-soft:#fff3c4;--orange:#f28220;--orange-soft:#fde6d0;
 --ok:#1d7a4a;--ok-soft:#dcf2e6;--bad:#b3261e;--bad-soft:#fbe0de;--shadow:0 1px 2px rgba(16,32,60,.08);
 --font-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;--font-head:'Fraunces',Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0e1520;--surface:#162131;--surface2:#1d2b40;--fg:#e8edf5;--muted:#9aa8bd;--line:#2a3a52;
 --blue:#6aa9ff;--blue-fg:#07182e;--blue-soft:#1b2f4d;--yellow:#ffd23f;--yellow-soft:#3d3410;--orange:#ff9a4d;--orange-soft:#42281a;
 --ok:#5fd394;--ok-soft:#143626;--bad:#ff8f87;--bad-soft:#431c1a;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0e1520;--surface:#162131;--surface2:#1d2b40;--fg:#e8edf5;--muted:#9aa8bd;--line:#2a3a52;
 --blue:#6aa9ff;--blue-fg:#07182e;--blue-soft:#1b2f4d;--yellow:#ffd23f;--yellow-soft:#3d3410;--orange:#ff9a4d;--orange-soft:#42281a;
 --ok:#5fd394;--ok-soft:#143626;--bad:#ff8f87;--bad-soft:#431c1a;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
 padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-family:var(--font-head);font-size:26px;line-height:1.15}
h2{font-size:17px}h3{font-size:15px}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{background:#fff;border-radius:8px;padding:6px 10px;display:flex;align-items:center;border:1px solid var(--line)}
.logo img{height:38px;width:auto;display:block;max-width:100%}
.brand small{color:var(--muted);display:block;font-size:12px}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.bell{position:relative;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.bell b{background:var(--orange);color:#1c0f00;border-radius:999px;padding:0 7px;margin-left:6px;font-size:12px}
.body{display:flex;flex-direction:column;gap:18px;flex:1;padding-block:0 20px}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.nav>button,.more>summary{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--fg);font-weight:600;list-style:none}
.nav>button:hover,.more>summary:hover{background:var(--surface2)}
.nav>button.on,.more.on>summary{background:var(--blue);color:var(--blue-fg)}
.more{position:relative}
.more>summary::-webkit-details-marker{display:none}
.menu{position:absolute;left:0;top:44px;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(8,16,30,.25);padding:6px;display:flex;flex-direction:column;z-index:30}
.menu button{display:flex;justify-content:space-between;align-items:center;text-align:left;min-height:38px;padding:0 10px;border:0;border-radius:6px;background:transparent;cursor:pointer;color:var(--fg)}
.menu button:hover{background:var(--surface2)}
.menu button.on{background:var(--blue-soft);color:var(--blue);font-weight:700}
.menu .sep{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 2px}
.cnt{background:var(--yellow);color:#241b00;border-radius:999px;font-size:12px;padding:0 7px;font-weight:700}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.sb{justify-content:space-between}
.sub{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .n{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue)}
.kpi .l{font-size:13px;color:var(--muted)}
.btn{min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--fg)}
.btn:hover{border-color:var(--blue)}
.btn.p{background:var(--blue);border-color:var(--blue);color:var(--blue-fg)}
.btn.d{color:var(--bad);border-color:var(--bad)}
.btn.s{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
input,select,textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
textarea{min-height:72px;resize:vertical}
input[type=checkbox]{width:auto;min-height:0}
.f{min-width:0}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.err{color:var(--bad);font-size:13px;margin-top:4px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.st.Waiting{background:var(--yellow-soft);color:var(--fg);border:1px solid var(--yellow)}
.st.In-meeting{background:var(--blue-soft);color:var(--blue)}
.st.Checked-out,.st.Approved,.st.Checked-in{background:var(--ok-soft);color:var(--ok)}
.st.Cancelled,.st.Declined{background:var(--surface2);color:var(--muted)}
.st.Denied{background:var(--bad-soft);color:var(--bad)}
.st.Pending-approval{background:var(--orange-soft);color:var(--fg);border:1px solid var(--orange)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.col h2{display:flex;justify-content:space-between;margin-bottom:8px}
.vc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--yellow);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.vc.mt{border-left-color:var(--blue)}.vc.dn{border-left-color:var(--ok);opacity:.85}.vc.fl{border-left-color:var(--bad)}
.vc .nm{font-weight:700}
.vc .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.warn{background:var(--orange-soft);border:1px solid var(--orange);border-radius:8px;padding:10px 12px}
.info{background:var(--blue-soft);border-radius:8px;padding:10px 12px}
.okbox{background:var(--ok-soft);border-radius:8px;padding:10px 12px;color:var(--ok)}
.bad{background:var(--bad-soft);border-radius:8px;padding:10px 12px;color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(8,16,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.md.wide{max-width:820px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:60;max-width:90vw}
.chk{display:flex;gap:8px;align-items:flex-start}
.chk input{margin-top:4px}
.tl{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:8px;padding:10px 12px;background:var(--surface)}
.slot.clash{border-left-color:var(--bad);background:var(--bad-soft)}
.slot .tm{min-width:110px;font-weight:700;font-variant-numeric:tabular-nums}
footer{border-top:1px solid var(--line);padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.center{max-width:560px;margin:60px auto;display:flex;flex-direction:column;gap:16px}
svg text{fill:var(--muted);font-size:10px}
@media (max-width:600px){.nav>button,.more>summary{padding:0 10px}.menu{left:auto;right:0}}
</style>
</head><body>

const fmtT=i=>i?new Date(i).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true,timeZone:TZ}):"";

function normMobile(raw){
 let s=String(raw||"").trim().replace(/[\s\-().]/g,"");if(!s)return null;
 let d;
 if(s.startsWith("+")){d=s.slice(1).replace(/\D/g,"")}
 else{d=s.replace(/\D/g,"");if(d.length===10)d="91"+d;else if(d.length===11&&d[0]==="0")d="91"+d.slice(1);else if(d.length===12&&d.startsWith("91"))d=d}
 if(d.length<8||d.length>15)return null;
 return{mobile:"+"+d,key:d.slice(-10)};
}
const normEmail=e=>String(e||"").trim().toLowerCase();
const okEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const normName=n=>String(n||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function parseDob(v){
 if(v==null||v==="")return{ok:true,val:""};
 let y,m,d;
 if(v instanceof Date){y=v.getFullYear();m=v.getMonth()+1;d=v.getDate()}
 else{const s=String(v).trim();let a;
  if(a=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)){y=+a[1];m=+a[2];d=+a[3]}
  else if(a=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/)){d=+a[1];m=+a[2];y=+a[3]}
  else return{ok:false}}
 const dt=new Date(Date.UTC(y,m-1,d));
 if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d||y<1900)return{ok:false};
 const val=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
 if(val>todayKey())return{ok:false,future:true};
 return{ok:true,val};
}
function csvCell(v){let s=String(v??"");if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
const toCsv=rows=>rows.map(r=>r.map(csvCell).join(",")).join("\r\n");

function getPath(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[k],o)}

async function reserveCodes(k){
 const ref=S.db.doc("counters/contacts");
 for(let i=0;i<12;i++){
  const r=await ref.acquire({holder:S.uid||"x",ttlMs:5000});
  if(r.acquired){const s=await ref.get();const n=s.exists?(s.data().n||0):0;await ref.set({n:n+k});
   return Array.from({length:k},(_,j)=>"AP-C-"+String(n+1+j).padStart(6,"0"))}
  await sleep(250+Math.random()*400);
 }
 throw new Error("Could not reserve a contact code. Try again.");
}

function suggestRoom(hostId,type){
 const list=D().config.rules?.list||[];
 for(const r of list){
  const hm=r.hostId==="*"||r.hostId===hostId,tm=!r.types||!r.types.length||r.types.includes(type);
  if(hm&&tm&&D().rooms[r.roomId])return r.roomId;
 }
 return D().hosts[hostId]?.roomId||"";
}
const boardRoomId=()=>Object.keys(D().rooms).find(k=>/board/i.test(D().rooms[k].name))||"r_board";

const activeVisit=cid=>visitsArr().find(v=>v.contactId===cid&&(v.status==="Waiting"||v.status==="In meeting"));
function findDupes(f){
 const out=[];const key=f.mobile?normMobile(f.mobile)?.key:null;const em=normEmail(f.email);const n=normName(f.name);
 for(const c of contactsArr()){
  let why=[];
  if(key&&c.mobileKey===key)why.push("same mobile");
  if(em&&normEmail(c.email)===em)why.push("same email");
  if(n&&n.length>3){const cn=normName(c.name);if(cn===n)why.push("same name");else if(n.length>6&&cn.length>6&&lev(cn,n)<=2)why.push("similar name")}
  if(why.length)out.push({c,why,exact:why.some(w=>w.startsWith("same m")||w==="same email")});
 }
 return out.slice(0,6);
}

/* ---------- modal helpers ---------- */
function modal(title,bodyHtml,{wide=false,actions=[{label:"Close",v:null}]}={}){
 return new Promise(res=>{
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="md ${wide?"wide":""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div id="mdBody">${bodyHtml}</div><div class="row" style="justify-content:flex-end">${actions.map((a,i)=>`<button class="btn ${a.cls||""}" data-i="${i}">${esc(a.label)}</button>`).join("")}</div></div>`;
  document.body.appendChild(ov);
  const done=v=>{ov.remove();res(v)};
  ov.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;const a=actions[+b.dataset.i];
   if(a.collect){const r=a.collect(ov);if(r===false)return;done(r)}else done(a.v)});
  const f=$("input,select,textarea",ov);if(f)f.focus();
 });

/* ---------- boot ---------- */
function scheduleRender(){if(S._r)return;S._r=requestAnimationFrame(()=>{S._r=0;render()})}
function subscribe(){
 const one=(name,q,map)=>q.onSnapshot(snap=>{
  const m={};snap.docs.forEach(d=>m[d.id]=d.data());
  const prev=S.d[name];
  if(map)map(m,prev);
  S.d[name]=m;S.loaded[name]=true;scheduleRender();
 },e=>{S.err=e&&e.code||"unavailable";scheduleRender()});
 one("hosts",col("hosts"));one("rooms",col("rooms"));one("config",col("config"));one("staff",col("staff"));
 one("contacts",col("contacts"));one("appts",col("appts"));one("staging",col("staging"));
 const since=new Date(Date.now()-400*864e5).toISOString();
 one("visits",col("visits").where("checkIn",">=",since),(m,prev)=>{
  if(!S.loaded.visits)return;
  for(const [id,v] of Object.entries(m)){
   const p=prev[id];
   if(S.role&&S.role!=="host"&&p&&v.hostReply==="Send in"&&p.hostReply!=="Send in"){beep();toast((v.contactName||"A visitor")+": host replied Send in")}
   if(S.role==="host"&&S.hostId&&v.hostId===S.hostId&&(!p||(v.reminders||0)>(p.reminders||0))&&v.status==="Waiting"){beep();toast("Visitor waiting: "+(v.contactName||""))}
  }
 });
 col("audit").orderBy("at","desc").limit(300).onSnapshot(snap=>{S.d.audit=snap.docs.map(d=>({id:d.id,...d.data()}));scheduleRender()},()=>{});
 S.db.doc("requests/"+S.uid).onSnapshot(s=>{S.myReq=s.exists?s.data():null;scheduleRender()},()=>{});
}
function resolveRole(){
 if(S.isOwner){S.role="admin";S.hostId=Object.values(D().staff).find(x=>x.uid===S.uid)?.hostId||null;return}
 const rec=D().staff[S.uid];
 S.staffRec=rec||null;
 if(rec&&rec.status==="active"){S.role=rec.role;S.hostId=rec.hostId||null}
 else S.role=null;
}
async function boot(){
 try{
  S.db=await claude.use("db");S.user=await claude.use("user");
  if(!S.db||!S.user){S.fatal="unavailable";render();return}
  S.uid=await S.user.id();S.isOwner=await S.user.isOwner();
  S.me=await S.user.me();
  S.canWrite=await S.user.can("data.write");
  if(!S.uid){S.fatal="noid";render();return}
  S.dl=await claude.use("downloads");
  subscribe();
 }catch(e){S.fatal="unavailable";}
 render();
 setInterval(()=>{if(["board","onprem","today"].includes(S.view))render()},30000);
}

/* ---------- Meeting day ---------- */
function vMeetday(){
 if(!S.mdDate){let d=todayKey();for(let i=0;i<8;i++){const dt=new Date(Date.now()+i*864e5);const k=dayKey(dt.toISOString());const w=weekday(k);if(w==="Tuesday"||w==="Saturday"){d=k;break}}S.mdDate=d}
 const k=S.mdDate;const br=boardRoomId();
 const items=[];
 for(const a of apptsArr()){if(a.date===k&&["Approved","Pending approval","Checked in"].includes(a.status)&&suggestRoom(a.hostId,a.type)===br&&!a.visitId)items.push({kind:"appt",id:a.id,name:a.name,org:a.org,type:a.type,status:a.status,start:a.time,dur:+a.dur||60,host:a.hostId})}
 for(const v of visitsArr()){if(dayKey(v.checkIn)===k&&v.roomId===br&&v.status!=="Cancelled"&&v.status!=="Denied"){const st=new Date(v.checkIn).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:TZ});items.push({kind:"visit",id:v.id,name:v.contactName,org:v.org,type:v.type,status:v.status,start:st,dur:Math.max(30,mins(v.checkIn,v.checkOut||nowIso())),host:v.hostId})}}
 items.sort((a,b)=>a.start.localeCompare(b.start));
 const toM=t=>{const [h,m]=t.split(":");return +h*60+ +m};
 items.forEach((it,i)=>{it.clash=items.some((o,j)=>j!==i&&toM(o.start)<toM(it.start)+it.dur&&toM(it.start)<toM(o.start)+o.dur)});
 const w=weekday(k);
 return `<div class="row sb"><div><h1>Meeting day</h1><p class="sub">Board room, 3rd floor. Tuesday and Saturday are the client and vendor meeting days.</p></div>
 <div class="row"><button class="btn s" data-act="mdShift" data-n="-1">←</button><input id="mdD" type="date" style="width:170px" data-b="mdDate" value="${esc(k)}"><button class="btn s" data-act="mdShift" data-n="1">→</button></div></div>
 <div class="${w==="Tuesday"||w==="Saturday"?"info":"warn"}">${dkLabel(k)} is a ${w}${w==="Tuesday"||w==="Saturday"?" · meeting day":" · not a regular meeting day"}</div>
 ${items.some(i=>i.clash)?`<div class="warn"><b>Clash:</b> some Board room slots overlap. Move one of them.</div>`:""}
 <div class="tl">${items.map(i=>`<div class="slot ${i.clash?"clash":""}"><div class="tm">${esc(i.start)}<div class="sub">${i.dur} min</div></div><div style="flex:1;min-width:0"><b>${esc(i.name)}</b>${i.org?" · "+esc(i.org):""}<div class="sub">${esc(i.type)} · with ${esc(hostName(i.host))}</div></div><div>${stChip(i.status)}${i.kind==="appt"&&(can("checkin")||isSup())?`<div style="margin-top:6px"><button class="btn s" data-act="apEdit" data-id="${i.id}">Edit time</button></div>`:""}</div></div>`).join("")||`<p class="sub">No Board room meetings on this date.</p>`}</div>`;
}

function barChart(items,{w=420,h=150}={}){
 const max=Math.max(1,...items.map(i=>i.v));const pad=22,bw=(w-pad)/items.length;
 return `<svg viewBox="0 0 ${w} ${h+30}" width="100%" role="img" aria-label="Bar chart"><line x1="${pad}" y1="${h}" x2="${w}" y2="${h}" stroke="var(--line)"/>
 ${[0,.5,1].map(f=>`<line x1="${pad}" x2="${w}" y1="${h-f*(h-14)}" y2="${h-f*(h-14)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="0" y="${h-f*(h-14)+3}">${Math.round(max*f)}</text>`).join("")}
 ${items.map((i,n)=>{const bh=i.v/max*(h-14);const x=pad+n*bw+bw*.15;return `<rect x="${x}" y="${h-bh}" width="${bw*.7}" height="${bh}" rx="2" fill="var(--blue)"/>${i.v?`<text x="${x+bw*.35}" y="${h-bh-3}" text-anchor="middle" style="fill:var(--fg)">${i.v}</text>`:""}${(items.length<=12||n%2===0)?`<text x="${x+bw*.35}" y="${h+14}" text-anchor="middle">${esc(i.l)}</text>`:""}`}).join("")}</svg>`;
}

const IMP_FIELDS=[["name","Full name *"],["mobile","Mobile *"],["email","Email"],["dob","Date of birth"],["org","Organisation"],["designation","Designation"],["address","Address"]];
const IMP_GUESS={name:/name/i,mobile:/mobile|phone|contact no|whatsapp/i,email:/e-?mail/i,dob:/dob|birth/i,org:/org|company|firm/i,designation:/design|title|role/i,address:/address|city/i};
function vImport(){
 const im=S.im;
 const stg=Object.entries(D().staging).map(([id,s])=>({id,...s}));
 return `<div class="row sb"><div><h1>Import contacts</h1><p class="sub">CSV or Excel. Nothing is saved until you confirm the preview.</p></div><button class="btn" data-act="imTemplate">Download template</button></div>
 <div class="card"><div class="f"><label for="imFile">Choose a file (.csv or .xlsx)</label><input id="imFile" type="file" accept=".csv,.xlsx,.xls"></div>
 ${im&&im.err?`<div class="err">${esc(im.err)}</div>`:""}
 ${im&&im.rows?imPreview(im):""}</div>
 <div class="card"><h2 style="margin-bottom:6px">Staging: rows needing review (${stg.length})</h2><p class="sub">Incomplete or duplicate rows wait here. They are not contacts, and they never trigger reminders.</p>
 <div class="tbl"><table><thead><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Why held</th><th></th></tr></thead><tbody>${stg.slice(0,60).map(s=>`<tr><td>${esc(s.name||"")}</td><td>${esc(s.mobile||"")}</td><td>${esc(s.email||"")}</td><td>${esc(s.why||"")}</td><td><button class="btn s d" data-act="imDrop" data-id="${s.id}">Remove</button></td></tr>`).join("")||`<tr><td colspan="5" class="sub">Nothing held for review.</td></tr>`}</tbody></table></div>${stg.length?`<div style="margin-top:8px"><button class="btn s d" data-act="imDropAll">Clear all staging rows</button></div>`:""}</div>`;
}
function imEval(){
 const im=S.im;const existing=contactsArr();const seenM=new Set(),seenE=new Set();
 im.res=im.rows.map(row=>{
  const g=k=>{const h=im.map[k];return h?row[h]:""};
  const name=String(g("name")||"").trim(),mob=normMobile(g("mobile")),em=normEmail(g("email")),dobR=parseDob(g("dob")instanceof Date?g("dob"):g("dob"));
  const rec={name,mobile:mob?mob.mobile:String(g("mobile")||""),mobileKey:mob?mob.key:"",email:em,dob:dobR.ok?dobR.val:"",org:String(g("org")||"").trim(),designation:String(g("designation")||"").trim(),address:String(g("address")||"").trim()};
  let why="",kind="ok";
  if(!name){why="Missing name";kind="bad"}
  else if(!mob){why="Missing or invalid mobile";kind="bad"}
  else if(em&&!okEmail(em)){why="Invalid email";kind="bad"}
  else if(!dobR.ok){why=dobR.future?"Date of birth is in the future":"Invalid date of birth";kind="bad"}
  else if(existing.some(c=>c.mobileKey===mob.key||(em&&normEmail(c.email)===em))){why="Already exists (same mobile or email)";kind="dup"}
  else if(seenM.has(mob.key)||(em&&seenE.has(em))){why="Repeated inside the file";kind="dup"}
  if(kind==="ok"){seenM.add(mob.key);if(em)seenE.add(em)}
  return{rec,why,kind};
 });
}
function imPreview(im){
 if(!im.res)imEval();
 const ok=im.res.filter(r=>r.kind==="ok").length,bad=im.res.filter(r=>r.kind==="bad").length,dup=im.res.filter(r=>r.kind==="dup").length;
 return `<h3 style="margin-top:14px">Map columns</h3><div class="grid g4" style="margin-top:6px">${IMP_FIELDS.map(([k,l])=>`<div class="f"><label for="imm_${k}">${l}</label><select id="imm_${k}" data-im="${k}"><option value="">— none —</option>${im.headers.map(h=>`<option ${im.map[k]===h?"selected":""}>${esc(h)}</option>`).join("")}</select></div>`).join("")}</div>
 <div class="row" style="margin:12px 0"><span class="pill">Ready ${ok}</span><span class="pill">Incomplete ${bad}</span><span class="pill">Duplicate review ${dup}</span><span class="sub">${im.rows.length} rows read</span></div>
 <div class="tbl"><table><thead><tr><th>Row</th><th>Name</th><th>Mobile</th><th>Email</th><th>DOB</th><th>Result</th></tr></thead><tbody>${im.res.slice(0,50).map((r,i)=>`<tr><td>${i+2}</td><td>${esc(r.rec.name)}</td><td>${esc(r.rec.mobile)}</td><td>${esc(r.rec.email)}</td><td>${esc(r.rec.dob?fmtDob(r.rec.dob,true):"")}</td><td>${r.kind==="ok"?`<span class="st Approved">Ready</span>`:`<span class="st ${r.kind==="bad"?"Denied":"Pending-approval"}">${esc(r.why)}</span>`}</td></tr>`).join("")}</tbody></table></div>
 ${im.res.length>50?`<p class="sub">Showing the first 50 rows.</p>`:""}
 <div class="row" style="margin-top:12px"><button class="btn p" data-act="imConfirm" ${ok?"":"disabled"}>Import ${ok} ready contact${ok===1?"":"s"}</button><button class="btn" data-act="imCancel">Cancel</button><span class="hint">Incomplete and duplicate rows go to staging. No placeholder emails or birthdays are invented.</span></div>`;
}
async function imLoad(file){
 S.im={err:"",rows:null};
 try{
  const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:"array",cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true});
  if(!rows.length){S.im.err="No rows found in the first sheet.";render();return}
  const headers=Object.keys(rows[0]);const map={};
  for(const [k,re] of Object.entries(IMP_GUESS)){map[k]=headers.find(h=>re.test(h))||""}
  S.im={err:"",rows,headers,map,fileName:file.name};
 }catch(e){S.im={err:"Could not read that file. Use the template format.",rows:null}}
 render();
}
async function imConfirm(){
 const im=S.im;if(!im||!im.res)return;
 const ok=im.res.filter(r=>r.kind==="ok");if(!ok.length)return;
 if(!(await confirmBox("Import contacts","Import "+ok.length+" contacts? "+(im.res.length-ok.length)+" rows will go to staging for review.","Import")))return;
 try{
  const codes=await reserveCodes(ok.length);
  for(let i=0;i<ok.length;i+=10){
   await Promise.all(ok.slice(i,i+10).map((r,j)=>col("contacts").doc().set({code:codes[i+j],...r.rec,notes:"",isPr:false,source:"import",createdBy:S.uid,createdAt:nowIso(),updatedBy:S.uid,updatedAt:nowIso()})));
  }
  const rest=im.res.filter(r=>r.kind!=="ok");
  for(let i=0;i<rest.length;i+=10)await Promise.all(rest.slice(i,i+10).map(r=>col("staging").add({name:r.rec.name,mobile:r.rec.mobile,email:r.rec.email,why:r.why,createdAt:nowIso(),createdBy:S.uid})));
  await log("import",ok.length+" imported, "+rest.length+" held ("+im.fileName+")");
  toast("Imported "+ok.length+" contacts");S.im=null;render();
 }catch(e){toast(e.message||"Import failed")}
}

async function delSamples(){
 if(!(await confirmBox("Delete sample data","This removes every record tagged Sample. Contact codes already used are not reused.","Delete")))return;
 for(const [id,c] of Object.entries(D().contacts))if(c.sample)await S.db.doc("contacts/"+id).delete();

document.addEventListener("click",async e=>{
 const el=e.target.closest("[data-act]");if(!el||!S.db)return;
 const f=ACT[el.dataset.act];if(!f)return;
 try{el.disabled===false&&(el.disabled=true);await f(el)}catch(x){toast(x&&x.message?x.message:"Something went wrong. Try again.")}
 finally{if(el.isConnected)el.disabled=false}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset.b){setPath(S,t.dataset.b,t.type==="checkbox"?t.checked:t.value);
  if(t.dataset.reset)setPath(S,t.dataset.reset,0);
  if(t.dataset.live&&LIVE[t.dataset.live])LIVE[t.dataset.live]();
  if(t.dataset.manual){S.ci.roomAuto=false}
  if(t.dataset.b==="ct.q"||t.dataset.b==="board.q")scheduleRender();
 }
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.id==="imFile"&&t.files[0]){imLoad(t.files[0]);return}
 if(t.dataset.im){S.im.map[t.dataset.im]=t.value;S.im.res=null;render();return}
 if(t.dataset.b){
  setPath(S,t.dataset.b,t.type==="checkbox"?t.checked:t.value);
  if(t.dataset.room){S.ci.roomAuto=true}
  if(t.dataset.b==="ci.type"&&t.value==="Wellness session"){S.ci.purpose="Wellness session";S.ci.remarks=""}
  if(t.dataset.b==="ci.type"&&t.value!=="Wellness session"&&S.ci.purpose==="Wellness session")S.ci.purpose="Project discussion";
  render();
 }
});
document.addEventListener("toggle",e=>{if(e.target.matches&&e.target.matches("details.more"))S.moreOpen=e.target.open},true);
boot();
